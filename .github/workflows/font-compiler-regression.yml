name: Validate Universal Font Compiler
on:
  pull_request:
    branches:
      - main
    paths:
      - common/universal_font_compiler.py
      - common/universal_font_compiler.sh
      - common/universal_font_plan.py
      - common/minimal_xml_router.py
      - common/device_font_slot_plan.py
      - common/device_font_slot_plan_base.py
      - common/device_font_slot_build_base.py
      - scripts/universal_font_compiler_test.py
      - scripts/universal_font_compiler_bridge_test.sh
      - .github/workflows/font-compiler-regression.yml
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install font compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-fonttools fonts-dejavu-core >/dev/null
      - name: Compile and run Phase 6 tests
        run: |
          set -eu
          python3 -m py_compile \
            common/universal_font_plan.py \
            common/minimal_xml_router.py \
            common/universal_font_compiler.py \
            scripts/universal_font_compiler_test.py
          sh -n common/universal_font_compiler.sh
          sh -n scripts/universal_font_compiler_bridge_test.sh
          python3 scripts/universal_font_compiler_test.py
          sh scripts/universal_font_compiler_bridge_test.sh
