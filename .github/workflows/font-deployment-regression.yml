name: Unified Font Deployment regression

on:
  pull_request:
    paths:
      - common/universal_font_compiler.py
      - common/universal_font_deployment.py
      - common/universal_font_deployment.sh
      - common/universal_next_boot.sh
      - common/universal_mount_runtime.sh
      - common/universal_font_plan.py
      - common/minimal_xml_router.py
      - post-fs-data.sh
      - post-mount.sh
      - service.sh
      - scripts/universal_font_compiler_test.py
      - scripts/universal_font_deployment_test.py
      - scripts/universal_font_deployment_bridge_test.sh
      - scripts/universal_mount_runtime_test.sh
      - scripts/module_payload_manifest.txt
      - .github/workflows/font-deployment-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install font dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'fonttools==4.63.0'
      - name: Validate Phase 6 and Phase 7
        run: |
          set -eu
          python3 -m py_compile             common/universal_font_plan.py             common/minimal_xml_router.py             common/universal_font_compiler.py             common/universal_font_deployment.py             scripts/universal_font_deployment_test.py
          sh -n common/universal_font_deployment.sh
          sh -n common/universal_next_boot.sh
          sh -n common/universal_mount_runtime.sh
          sh -n post-fs-data.sh
          sh -n post-mount.sh
          sh -n service.sh
          sh -n scripts/universal_font_deployment_bridge_test.sh
          sh -n scripts/universal_mount_runtime_test.sh
          test -f scripts/universal_font_deployment_bridge_test.sh
          test -f scripts/universal_mount_runtime_test.sh
          python3 scripts/universal_font_compiler_test.py
          test -f scripts/universal_font_deployment_bridge_test.sh
          test -f scripts/universal_mount_runtime_test.sh
          python3 scripts/universal_font_deployment_test.py
          if [ ! -f scripts/universal_font_deployment_bridge_test.sh ] || [ ! -f scripts/universal_mount_runtime_test.sh ]; then
            pwd
            ls -la scripts | tail -n 80
            git status --short
            exit 1
          fi
          sh "$GITHUB_WORKSPACE/scripts/universal_font_deployment_bridge_test.sh"
          sh "$GITHUB_WORKSPACE/scripts/universal_mount_runtime_test.sh"
          grep -qx 'common/universal_font_deployment.py' scripts/module_payload_manifest.txt
          grep -qx 'common/universal_font_deployment.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/universal_next_boot.sh' scripts/module_payload_manifest.txt
          grep -qx 'common/universal_mount_runtime.sh' scripts/module_payload_manifest.txt
