name: Stable 1.1.1 repair verification
on:
  push:
    branches: [fix/111-clean-exit-20260928]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable111-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import checksum-verified 1.1.1-based changes
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/transfer-v2/part0.b64 ]]; then
            git merge-base --is-ancestor be39f598bfb921526851c5c4a2e92905dacf4ea7 HEAD
            cat .github/transfer-v2/part{0,1,2,3,4,5}.b64 | base64 -d > "$RUNNER_TEMP/release.patch.xz"
            echo 'f50014d7020a1d2485db29931edd173bbf8d9a4c65b8fe17221eb82a74975c1a  '"$RUNNER_TEMP/release.patch.xz" | sha256sum -c -
            xz -dc "$RUNNER_TEMP/release.patch.xz" > "$RUNNER_TEMP/release.patch"
            git apply --unidiff-zero --check "$RUNNER_TEMP/release.patch"
            git apply --unidiff-zero "$RUNNER_TEMP/release.patch"
            git apply --check .github/transfer-v2/followup.patch
            git apply .github/transfer-v2/followup.patch
            git rm -r .github/transfer-v2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'feat: release 2.0.0 from 1.1.1 with one-shot tasks, retired global weight and refined flashing UI'
            git push origin HEAD:fix/111-clean-exit-20260928
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Prepare verified runtime and host fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core python3-venv zip unzip file >/dev/null
          curl -fL --retry 2 --max-time 120 https://github.com/xgl34222220-ops/LuoShu/releases/download/refactor-v1.1.1/LuoShu-v1.1.1.zip -o "$RUNNER_TEMP/baseline.zip"
          echo 'c5c8fa86af4ac196107ba05c5ee8cc1944140ae033cc9e763cec8c76f40c848a  '"$RUNNER_TEMP/baseline.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/baseline.zip" 'common/python/*'
          chmod +x common/python/bin/luoshu-python
      - name: Complete backend and lifecycle checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          sh scripts/check.sh 2>&1 | tee verification/source-checks.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-source-checks
          path: verification/
          retention-days: 14
  android:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Prepare fixed release signature
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUOSHU_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do test -n "${!key}"; done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luoshu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/luoshu-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Lint, test and build signed App
        working-directory: android-app
        shell: bash
        env:
          LUOSHU_KEYSTORE_FILE: ${{ runner.temp }}/luoshu-release.jks
          LUOSHU_KEYSTORE_PASSWORD: ${{ secrets.LUOSHU_KEYSTORE_PASSWORD }}
          LUOSHU_KEY_ALIAS: ${{ secrets.LUOSHU_KEY_ALIAS }}
          LUOSHU_KEY_PASSWORD: ${{ secrets.LUOSHU_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p ../verification
          gradle --no-daemon --stacktrace :app:lintRelease :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee ../verification/android-build.log
      - name: Verify fixed signing certificate and version
        shell: bash
        run: |
          set -euo pipefail
          apk=android-app/app/build/outputs/apk/release/app-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$signer" verify --verbose --print-certs "$apk" | tee verification/signature.txt
          grep -qx 'Number of signers: 1' verification/signature.txt
          grep -Eq '^Verified using v(2|3|3\.1|3\.2) scheme.*: true$' verification/signature.txt
          grep -q 'certificate SHA-256 digest: e0043b560a10111d3ffddd3a7afba680b854e14ed793c7a3fdb7f8b7aa95ff27' verification/signature.txt
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          "$aapt" dump badging "$apk" > verification/apk-badging.txt
          grep -q "name='io.github.xgl34222220.luoshu' versionCode='7000001' versionName='2.0.0'" verification/apk-badging.txt
          git rev-parse HEAD > verification/commit.txt
          cp "$apk" verification/LuoShu-App-v2.0.0.apk
          git archive --format=zip HEAD > verification/LuoShu-v2.0.0-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-signed-candidate
          path: |
            verification/
            android-app/app/build/reports/
            android-app/app/build/test-results/
          retention-days: 14
