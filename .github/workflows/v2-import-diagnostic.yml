name: V2 import diagnostic
on:
  push:
    branches: [fix/111-clean-exit-20260928]
    paths: ['.github/workflows/v2-import-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact candidate and conflicting fixture patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inspect"
          cat .github/transfer-v2/part{0,1,2,3,4,5}.b64 | base64 -d > "$RUNNER_TEMP/inspect/release.patch.xz"
          echo 'f50014d7020a1d2485db29931edd173bbf8d9a4c65b8fe17221eb82a74975c1a  '"$RUNNER_TEMP/inspect/release.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/inspect/release.patch.xz" > "$RUNNER_TEMP/inspect/release.patch"
          git apply --unidiff-zero --check "$RUNNER_TEMP/inspect/release.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/inspect/release.patch"
          git apply --check .github/transfer-v2/followup.patch > "$RUNNER_TEMP/inspect/apply.log" 2>&1 || true
          cp .github/transfer-v2/followup.patch "$RUNNER_TEMP/inspect/followup.patch"
          tar --exclude=.git --exclude=.github/transfer-v2 -czf "$RUNNER_TEMP/inspect/candidate.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: v2-import-inspect
          path: ${{ runner.temp }}/inspect/
          retention-days: 7
